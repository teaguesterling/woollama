[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "woollama-core"
version = "0.9.0"
description = "The embeddable woollama model-management core (Rust) — start of the v1.0 port."
requires-python = ">=3.11"
# PEP 639 form, and the explicit `license-files` is required rather than stylistic. With the
# older `license = { text = ... }`, maturin still emitted `License-File: LICENSE` in PKG-INFO
# but — same workspace-member hoisting bug as `python-source` above — packaged the file at
# `<sdist>/woollama-core/LICENSE` while the metadata names `<sdist>/LICENSE`. PyPI validates
# that path and rejected the 0.8.1 sdist with a 400 after all 21 wheels had already uploaded.
# Declaring `license-files` explicitly makes maturin place LICENSE at the sdist root, so the
# claim is true. Note `twine check` PASSES the broken artifact — this is upload-time-only
# validation, which is why the check in wheels.yml verifies the path itself.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Ship the extension as `woollama.core` — a submodule of the PEP 420 `woollama`
# namespace (no woollama/__init__.py), so it IS the import the server + lackpy use:
# `from woollama.core import complete`. The dist is `woollama-core`; the import is
# `woollama.core`. (The server dist stops shipping its own woollama.core and depends
# on this — the actual dist-split — as the productionization step.)
module-name = "woollama.core"
# The `woollama` parent is a PEP 420 namespace package provided by this source tree
# (python/woollama/, no __init__.py). maturin nests the compiled `core` extension under
# it → `woollama/core.*.so`, so `from woollama.core import complete` resolves to the
# Rust ext directly (and `woollama` stays a shared namespace the server can also populate).
python-source = "python"
# REQUIRED, and load-bearing in a way that is easy to delete by accident.
#
# `python/woollama/` is an intentionally empty PEP 420 namespace directory whose only
# tracked file is `.gitkeep`. maturin ships `.gitkeep` in WHEELS but filters it out of
# SDISTS — so the directory came out empty, an empty directory is not archived, and the
# published sdist had no `python/` at all. Every source build then died on
#   `python-source is set to 'python' but the directory does not exist`
# which is how `pip install woollama` broke for anyone without a prebuilt wheel (#41).
#
# Naming the file explicitly is what forces it into the sdist. Do not "simplify" this by
# dropping `python-source`: without it maturin emits `core/core.so` (import path
# `core.core`), silently breaking `from woollama.core import complete`. Verified both ways.
# The sdist-installs test in wheels.yml is what keeps this honest.
include = [{ path = "python/woollama/.gitkeep", format = "sdist" }]
strip = true

[tool.pytest.ini_options]
# Self-contained: don't inherit the parent woollama pyproject's pytest config.
testpaths = ["tests"]

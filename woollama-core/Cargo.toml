[package]
name = "woollama-core"
version = "0.9.0"
edition = "2021"
description = "The embeddable woollama model-management core (Rust) — start of the v1.0 port."
license = "AGPL-3.0-or-later"

[lib]
name = "woollama_core"
crate-type = ["cdylib"]

[dependencies]
# The pure-Rust engine (no pyo3) lives in woollama-engine now; this crate is just
# the thin PyO3 wrapper that wires it to Python (InferenceError, PyToolProvider, the
# async-iterator pyclasses, the pyfunctions).
woollama-engine = { path = "../woollama-engine", version = "0.12.0" }
# NOTE: abi3 (stable ABI) is NOT usable here — `InferenceError` is
# `#[pyclass(extends = PyException, subclass)]`, and the limited API can't subclass built-in
# exception types. So wheels are built per CPython version (see .github/workflows/wheels.yml),
# and every new CPython release needs both a pyo3 that supports it and a matrix entry. Keep
# pyo3 current: 0.23 capped at CPython 3.13, which made 3.14 uninstallable by any route (#43).
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = "0.3"
async-trait = "0.1"
